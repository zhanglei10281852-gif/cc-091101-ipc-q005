# =============================================================================
# supervisor 示例配置（运维培训环境）
#
# 启动：
#   ipc_demo --supervisor examples/supervisor/supervisor.conf
#
# 操作：
#   kill -HUP  <pid>   热加载本文件（解析失败则运行中的服务不受影响）
#   kill -TERM <pid>   有序关停（先优雅信号，宽限期后 SIGKILL）
#   kill -INT <pid>    同上
#
# 事件流：stdout 上每行一个 JSON，可直接 | jq . 复盘完整生命周期。
# =============================================================================

global {
    backoff_start_ms = 200      # 首次失败后的退避间隔
    backoff_cap_ms   = 5000     # 退避间隔上限（指数：200,400,800... 封顶 5000）
    stable_uptime_ms = 2000     # 连续稳定运行 2s 后死亡，失败计数清零
}

# 1) 正常服务：收到 TERM 优雅退出（演示“退出接管”）
service "web" {
    command         = "/bin/sh" "examples/supervisor/graceful.sh"
    stop_signal     = TERM
    stop_timeout_ms = 3000
    max_restarts    = 3
}

# 2) 崩溃服务：周期性自杀，演示退避重启与重试耗尽
service "worker" {
    command         = "/bin/sh" "examples/supervisor/worker.sh"
    stop_signal     = TERM
    stop_timeout_ms = 2000
    max_restarts    = 5
}

# 3) 卡死服务：忽略 TERM，演示宽限期后被 SIGKILL 强制接管
service "stuck" {
    command         = "/bin/sh" "examples/supervisor/hang.sh"
    stop_signal     = TERM
    stop_timeout_ms = 1500
    max_restarts    = 2
}
