# Supervisor 示例配置
#
# 每个 [service:<名称>] 段定义一个被监管的命名子进程。
# 运行: ./ipc_supervisor --config supervisor.conf
# 热加载: kill -HUP <supervisor-pid>   （修改本文件后）
# 整体关停: kill -TERM <supervisor-pid>

[service:web]
command        = ./ipc_worker --name web cycle 1000
stop_signal    = TERM          # 优雅退出信号：TERM/INT/HUP/QUIT/USR1/USR2/ALRM
stop_grace_ms  = 2000          # 优雅退出宽限期，超时 SIGKILL
start_retries  = 5             # 生命周期内启动总次数上限（含首次）
backoff_ms     = 100,200,400,800   # 连续失败逐次退避，超出后取末值
stable_ms      = 1000          # 连续存活超过它即清零失败计数，恢复完整重试额度

[service:worker]
command        = ./ipc_worker --name worker sleep 30000
stop_signal    = TERM
stop_grace_ms  = 500
start_retries  = 3
backoff_ms     = 50,100,200
stable_ms      = 1000

# 卡死演示：该服务忽略 TERM，关停时会在宽限期后被 SIGKILL 接管
[service:stuck]
command        = ./ipc_worker --name stuck --ignore-term sleep 60000
stop_signal    = TERM
stop_grace_ms  = 800
start_retries  = 3
backoff_ms     = 50,100,200
stable_ms      = 1000
